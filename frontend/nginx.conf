server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API — path prefix is preserved (no trailing slash on proxy_pass)
    # since the backend mounts its routes under /api/... itself.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded fault-report images served by the backend.
    location /uploads/ {
        proxy_pass http://backend:5000;
    }

    # React Router: fall back to index.html for any unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

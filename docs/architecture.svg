<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Verdana, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">CarConnect Architecture</text>

  <text x="30" y="60" font-size="13" font-weight="bold" fill="#6366f1" letter-spacing="1">REQUEST FLOW</text>

  <g font-size="13" fill="#1e293b">
    <rect x="30" y="75" width="160" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="110" y="115" text-anchor="middle">Browser</text>

    <rect x="230" y="75" width="180" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="320" y="105" text-anchor="middle">Frontend</text>
    <text x="320" y="122" text-anchor="middle" font-size="11" fill="#475569">React + Caddy (HTTPS)</text>

    <rect x="450" y="75" width="180" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="540" y="105" text-anchor="middle">Backend</text>
    <text x="540" y="122" text-anchor="middle" font-size="11" fill="#475569">Express API</text>

    <rect x="670" y="75" width="180" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="760" y="105" text-anchor="middle">MongoDB Atlas</text>
    <text x="760" y="122" text-anchor="middle" font-size="11" fill="#475569">via Mongoose</text>
  </g>

  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="190" y1="110" x2="228" y2="110"/>
    <line x1="410" y1="110" x2="448" y2="110"/>
    <line x1="630" y1="110" x2="668" y2="110"/>
  </g>
  <g font-size="10.5" fill="#64748b">
    <text x="209" y="100" text-anchor="middle">HTTPS</text>
    <text x="429" y="100" text-anchor="middle">/api/*</text>
    <text x="649" y="100" text-anchor="middle">TLS</text>
  </g>

  <text x="30" y="200" font-size="13" font-weight="bold" fill="#10b981" letter-spacing="1">CI/CD DEPLOY PIPELINE</text>

  <g font-size="12.5" fill="#1e293b">
    <rect x="30" y="215" width="150" height="75" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="105" y="248" text-anchor="middle">git push</text>
    <text x="105" y="264" text-anchor="middle" font-size="11" fill="#475569">to main</text>

    <rect x="200" y="215" width="170" height="75" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="285" y="248" text-anchor="middle">GitHub Actions</text>
    <text x="285" y="264" text-anchor="middle" font-size="11" fill="#475569">lint + test + build</text>

    <rect x="390" y="215" width="170" height="75" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="475" y="248" text-anchor="middle">Docker Hub</text>
    <text x="475" y="264" text-anchor="middle" font-size="11" fill="#475569">push images</text>

    <rect x="580" y="215" width="150" height="75" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="655" y="248" text-anchor="middle">SSH deploy</text>
    <text x="655" y="264" text-anchor="middle" font-size="11" fill="#475569">appleboy/ssh-action</text>

    <rect x="750" y="215" width="190" height="75" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="845" y="248" text-anchor="middle">Oracle Cloud VM</text>
    <text x="845" y="264" text-anchor="middle" font-size="11" fill="#475569">docker compose up</text>
  </g>

  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="180" y1="252" x2="198" y2="252"/>
    <line x1="370" y1="252" x2="388" y2="252"/>
    <line x1="560" y1="252" x2="578" y2="252"/>
    <line x1="730" y1="252" x2="748" y2="252"/>
  </g>

  <text x="500" y="330" text-anchor="middle" font-size="11.5" fill="#64748b" font-style="italic">The Oracle Cloud VM here is the same host running the Frontend and Backend containers shown above.</text>

  <text x="30" y="380" font-size="11" fill="#94a3b8">Triggered on every push to main, only after the backend and frontend jobs pass.</text>

  <rect x="0.5" y="0.5" width="999" height="399" fill="none" stroke="#e2e8f0"/>
</svg>
